name: Build Premium Glass Dialer APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # GitHub-hosted Ubuntu images include the Android SDK. Do not run
      # setup-android here: the reported failure originates inside its SDK
      # initialization/sdmanager path before Gradle is reached.
      - name: Verify preinstalled Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_HOME/platform-tools" || { echo "Missing platform-tools in hosted runner SDK" >&2; exit 1; }
          test -d "$ANDROID_HOME/platforms/android-35" || { echo "Missing Android SDK platform 35 in hosted runner SDK" >&2; exit 1; }
          test -d "$ANDROID_HOME/build-tools/35.0.0" || { echo "Missing Android Build Tools 35.0.0 in hosted runner SDK" >&2; exit 1; }
          "$ANDROID_HOME/platform-tools/adb" version
          "$ANDROID_HOME/build-tools/35.0.0/aapt" version

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/devstyle/premiumdialer/MainActivity.kt
          test -f .github/workflows/android-apk.yml

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PremiumGlassDialer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PremiumGlassDialer-build-diagnostics
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 7
